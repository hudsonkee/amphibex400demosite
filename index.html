<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Carousel Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Carousel Section -->
    <header class="hero-section">
        <div class="carousel">
            <div class="carousel-track">
                <img class="carousel-slide" src="https://picsum.photos/1200/400?random=1" alt="Top Slide 1">
                <img class="carousel-slide" src="https://picsum.photos/1200/400?random=2" alt="Top Slide 2">
                <img class="carousel-slide" src="https://picsum.photos/1200/400?random=3" alt="Top Slide 3">
            </div>
        </div>
    </header>

    <!-- Main Content Section -->
    <main class="content-section">
        <h1>Welcome to the Site</h1>
        <p>Scroll down to see the green square carousel in action.</p>

        <!-- Green Square Section -->
        <div class="green-square">
            <h2 class="square-title">Featured Gallery</h2>
            
            <div class="carousel inner-carousel">
                <div class="carousel-track">
                    <img class="carousel-slide" src="https://picsum.photos/600/400?random=4" alt="Square Slide 1">
                    <img class="carousel-slide" src="https://picsum.photos/600/400?random=5" alt="Square Slide 2">
                    <img class="carousel-slide" src="https://picsum.photos/600/400?random=6" alt="Square Slide 3">
                </div>
            </div>
        </div>
    </main>

</body>
</html>
